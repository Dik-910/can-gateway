; 系统联调配置：can-node（vcan1）+ 本网关 + MQTT
;
; 拓扑：
;   tester (vcan0) --[诊断 0x7E0/0x7E8]--> 网关 --> can-node (vcan1)
;   can-node (vcan1) --[周期 0x180/0x181]--> 网关 --> MQTT gw/can
;
; 注意 b（vcan1）既是节点的总线、也是网关的上行来源，
; 所以周期帧不需要路由规则，采集发生在路由匹配之前。

[channels]
# 通道名, 接口, 波特率（用于负载率计算）
a = vcan0, 500000
b = vcan1, 500000

[routes]
# 只有诊断需要转发。周期帧留在 vcan1 上，网关旁路采集后上报，
# 不转发回 vcan0 —— 真实网关也不会把整条总线的数据复制到另一条上。
a,0x7E0,0x7E7,b,0,diag request tester->node
b,0x7E8,0x7EF,a,0,diag response node->tester

[diag]
# tester_ch,tester_req,tester_rsp,target_ch,target_req,target_rsp
a,0x7E0,0x7E8,b,0x7E0,0x7E8

[mqtt]
enabled = 1
addr = tcp://127.0.0.1:1883
topic = gw/can
client_id = can-gateway-sys
# 500ms 窗口：上报密一点，才看得出诊断期间有没有断
window = 500

[limits]
# 不给限速，联调要看清全量数据。
# 要验证限速时另配一份，不要把两种意图混在一个配置里。
