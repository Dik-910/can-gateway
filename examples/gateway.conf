# can-gateway 配置示例
#
# 通道名可自定义，routes / diag 段用名字引用通道。
# ID 支持十进制与 0x 十六进制。

[channels]
a = vcan0
b = vcan1

[routes]
# src,id_min,id_max,dst,offset,note[,mask]
#   不写 mask  ：按 [id_min, id_max] 范围匹配
#   写了 mask  ：按 (id & mask) == (id_min & mask) 匹配，此时 id_max 忽略
#
# 掩码能表达范围表达不了的条件，例如「只转发 0x180-0x18F」（mask=0x7F0）
# 或「整个 0x100 段」（mask=0x700，等价于范围但更简洁）。
a,0x100,0x1FF,b,0,status A->B
a,0x200,0x2FF,b,0,data A->B
b,0x300,0x3FF,a,0,cmd B->A

[diag]
# tester_ch,tester_req,tester_rsp,target_ch,target_req,target_rsp
# 一条映射连通一个 tester 与一个节点。第二个 tester 时 target_rsp 要换成不同的 ID。
a,0x7E0,0x7E8,b,0x7E0,0x7E8
