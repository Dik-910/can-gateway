# can-gateway 配置示例
#
# 通道名可自定义，routes / diag 段用名字引用通道。
# ID 支持十进制与 0x 十六进制。

[channels]
a = vcan0
b = vcan1

[routes]
# src,id_min,id_max,dst,offset,note[,mask]
#   不写 mask  ：按 [id_min, id_max] 范围匹配
#   写了 mask  ：按 (id & mask) == (id_min & mask) 匹配，此时 id_max 忽略
#
# 掩码能表达范围表达不了的条件，例如「只转发 0x180-0x18F」（mask=0x7F0）
# 或「整个 0x100 段」（mask=0x700，等价于范围但更简洁）。
a,0x100,0x1FF,b,0,status A->B
a,0x200,0x2FF,b,0,data A->B
b,0x300,0x3FF,a,0,cmd B->A

[diag]
# tester_ch,tester_req,tester_rsp,target_ch,target_req,target_rsp
# 一条映射连通一个 tester 与一个节点。第二个 tester 时 target_rsp 要换成不同的 ID。
a,0x7E0,0x7E8,b,0x7E0,0x7E8

[limits]
# 速率限制（帧/秒），防报文洪水。不写表示不限。
#
# 通道总速率：某节点故障后疯狂发报文会占满总线，让其他节点发不出去。
# 这里给每路一个上限，超出直接丢弃并计数。
a = 3000
b = 3000
#
# 单 ID 限速：id 通道名,ID,上限
# 0x181 是 20ms 周期（50 帧/秒），给 60 留一点余量；
# 超过说明有节点在异常重复发送。
id a,0x181,60

[mqtt]
# MQTT 上行。删掉这一段（或 enabled = 0）就关闭上报。
#
# 为什么需要 window：0x181 是 20ms 周期，一个 ID 就是 50 帧/秒。
# 逐帧上报的话一天四百万条，broker 和云端存储都扛不住，
# 而其中绝大多数是重复值。所以按窗口聚合，只上报有变化的条目。
addr = tcp://127.0.0.1:1883
topic = gw/can
client_id = can-gateway-1
window = 1000
# 只采集这两路；留空表示全部
# channels = a,b
