name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential python3-pip \
            libpaho-mqtt-dev mosquitto mosquitto-clients
          # can-isotp / udsoncan 用于跨仓库系统联调（UDS 探针）
          # cantools 用于按 can-node 的 DBC 校验上报内容
          python3 -m pip install --quiet paho-mqtt python-can can-isotp udsoncan cantools

      - name: Build
        run: make

      - name: Run unit tests
        run: make test

      # 单元测试全过但编译器有警告，说明有隐患被忽略了，所以再严格编一遍
      - name: Build with warnings as errors
        run: |
          make clean
          make CFLAGS="-std=c99 -Wall -Wextra -Werror -I. -Isrc/util -Isrc/channel -Isrc/route -Isrc/diag -Isrc/uplink -Ithirdparty"

      - name: Setup vcan and broker
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link add dev vcan1 type vcan
          sudo ip link set up vcan0
          sudo ip link set up vcan1

          if ! python3 -c "import socket;socket.create_connection(('127.0.0.1',1883),1)" 2>/dev/null; then
            mosquitto -p 1883 -d
            sleep 2
          fi
          python3 -c "
          import socket
          s = socket.create_connection(('127.0.0.1', 1883), timeout=3)
          s.close()
          print('broker reachable')
          "

      # 真实启动验证：读配置、跑起来、正常退出
      - name: Start gateway with example config
        run: |
          ./gateway --config examples/gateway.conf --stats 1 > /tmp/gw.log 2>&1 &
          GW=$!
          sleep 3
          kill -INT $GW
          wait $GW || true

          echo "--- gateway log ---"
          cat /tmp/gw.log

          # 必须出现引擎运行标记，否则是进程活着但没真正起来
          grep -q "engine running" /tmp/gw.log
          # 配置必须被完整读取
          grep -q "2 channel(s), 3 route(s), 1 diag map(s)" /tmp/gw.log
          # 优雅退出时应当打印统计
          grep -q "stats:" /tmp/gw.log
          # MQTT 上行必须真的启用
          grep -q "mqtt uplink:" /tmp/gw.log

      # 端到端：往 vcan 灌帧，验证 MQTT 收到聚合后的消息
      - name: MQTT uplink end-to-end
        run: |
          make uplink-check UP_ARGS="--if vcan0 --seconds 5" | tee /tmp/uplink.log
          # 必须真的跑了。Paho 缺失时 make 会 SKIP 并返回 0 —— 那属于静默跳过
          grep -qE "Result: [0-9]+ passed, 0 failed" /tmp/uplink.log
          grep -q "periodic id aggregated, not per-frame" /tmp/uplink.log
          echo "aggregation verified"

      # 跨仓库：把 can-node 拉下来，验证两个仓库合起来是不是一条系统。
      #
      # 这一步刻意依赖 can-node 的 main：它不是本仓库的单元测试，
      # 而是「两个仓库协同工作」的集成验证。can-node 改坏了，这里就该红 ——
      # 那正是我们想知道的，而不是要避免的噪音。
      - name: Cross-repo system check with can-node
        run: |
          git clone --depth 1 https://github.com/Dik-910/can-node.git can-node
          make -C can-node node

          make system-check SYS_ARGS="--node-bin can-node/node --dbc can-node/docs/can_matrix.dbc" | tee /tmp/sys.log

          # 必须真的跑起来，而不是被 SKIP 掉
          grep -qE "Result: [0-9]+ passed, 0 failed" /tmp/sys.log
          # 核心断言：诊断突发期间采集没有断
          grep -q "no long gap in 0x181 uplink" /tmp/sys.log
          # 协议一致性：上报的帧能被 can-node 的 DBC 解开
          grep -q "every 0x180 payload decodes" /tmp/sys.log
          echo "cross-repo integration verified"
